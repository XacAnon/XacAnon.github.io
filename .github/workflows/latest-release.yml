name: Update latest release

# Keeps the site's generated data in sync with Apple Music and YouTube:
# home countdown, music page button, links page, videos page, release pages
# and sitemap. Runs every 6 hours; can also be started by hand from the
# Actions tab with "Run workflow".
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh releases, videos and release pages
        run: python3 .github/scripts/update_site_data.py

      - name: Commit and publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data releases sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update release and video data"
          git push
          # Pushes made with the workflow token don't always rebuild Pages, so ask for a build.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Keep this schedule from being paused
        # GitHub pauses scheduled workflows after 60 days without repo activity.
        # Re-enabling the workflow resets that timer without making a commit.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/latest-release.yml/enable" || true
