<script>
(async () => {
  const r = await window.XacRelease.resolve(null);
  if (!r) return;
  const card = document.getElementById("links-release");
  document.getElementById("links-release-label").textContent = r.mode === "upcoming" ? "Coming soon" : "Latest release";
  document.getElementById("links-release-title").textContent = r.title || r.heading;
  document.getElementById("links-release-cta").textContent = r.mode === "upcoming" ? "Presave" : "Listen now";
  if (r.artwork) document.getElementById("links-release-art").src = r.artwork;
  // Released songs open their song page (all platforms); presaves go straight to the presave link
  card.href = r.mode === "latest" && r.slug ? "/releases/" + r.slug : (r.link || "/music");
  if (card.href.startsWith(location.origin)) { card.removeAttribute("target"); card.removeAttribute("rel"); }
  card.hidden = false;
})();
</script>
